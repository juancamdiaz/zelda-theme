font_size	13
	
disable_ligatures	no
enable_audio_bell	no
	
shell	fish
shell_integration	enable
	
cursor_shape	block
	
url_style	curly
	
remember_window_size	no
initial_window_width	640
initial_window_height	480
window_padding_width	10
cursor_blink_interval	0
	
background_opacity	0.7
scrollbar_handle_opacity 	0.50
scrollbar_track_opacity 	0.50
scrollbar_track_hover_opacity 	0.50
confirm_os_window_close	0
	
sync_to_monitor	no

# BEGIN_KITTY_FONTS
font_family      family="Departure Mono-Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# END_KITTY_THEME
